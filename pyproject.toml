[project]
name = "smart-learning-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "apps/backend"}

[tool.setuptools.packages.find]
where = ["apps/backend"]

[tool.setuptools.package-data]
"app" = ["web/dist/index.html", "web/dist/assets/*"]

[project.scripts]
smart-learning = "app.cli:main"
smart-learning-server = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend"]
